modLoader = "javafml"
loaderVersion = "[47,)"
license = "All Rights Reserved"

[[mods]]
modId = "legacytextures"
version = "0.2.1"
displayName = "Legacy Textures"
authors = "DBZ Legacy"
description = '''HD texture sets for DragonMineZ and NB Armors, with a per-player switch between HD and vanilla. Each player only changes what their own game draws. Includes NB Armors.'''
# Server keeps each player's choice; the client carries the textures and draws them. Both sides need the same jar.
displayTest = "MATCH_VERSION"

# NB Armors, absorbed (see com.dbzlegacy.legacytextures.nb). Its own mod entry keeps the nbarmors: namespace
# for every item, texture and model. Remove any separate nbarmors-*.jar: two copies of this mod id will not load.
[[mods]]
modId = "nbarmors"
version = "0.2.1"
displayName = "NB Armors (in Legacy Textures)"
authors = "Ported from NB Armors 3.1 by Naruke"
description = '''Port of the NB Armors 1.7.10 outfit pack (armor, vanity items and headwear) to Minecraft 1.20.1, with a shared Curios vanity slot. Shipped inside Legacy Textures.'''
displayTest = "MATCH_VERSION"

[[dependencies.legacytextures]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

# Pinned: the client hooks target Minecraft 1.20.1 SRG names. A different Minecraft must not load them silently.
[[dependencies.legacytextures]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.legacytextures]]
modId = "dragonminez"
mandatory = false
versionRange = "[2.2,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.nbarmors]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.nbarmors]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1]"
ordering = "NONE"
side = "BOTH"

# The shared vanity slot and the cosmetic renderer need Curios (DragonMineZ 2.2 already requires the same range).
[[dependencies.nbarmors]]
modId = "curios"
mandatory = true
versionRange = "[5.14.1,)"
ordering = "AFTER"
side = "BOTH"

# Not required: armor and cosmetics work without it. Declared so load order is stable when it is present,
# because DragonMineZ replaces the player renderer that these models are drawn through.
[[dependencies.nbarmors]]
modId = "dragonminez"
mandatory = false
versionRange = "[2.2,)"
ordering = "AFTER"
side = "BOTH"
