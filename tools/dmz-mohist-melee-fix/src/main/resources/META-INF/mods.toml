[[mods]]
modId = "dmz_mohist_melee_fix"
version = "2.12.27"
displayName = "DMZ Mohist Melee Fix"
authors = "DBZ Legacy Reborn"
description = '''
Fixes M1 animation-with-no-hit after world changes (empty/stale entity ID rescue),
clamps >64 ID packets, Shurui raid unlock, respawn-like attribute recovery.
Intentional DMZ stat resets update/clear the primary snapshot so restore cannot
resurrect old STR/etc. Does not override hasCreatedCharacter — vanilla DMZ
clears it so reset reopens race select. Soft keepPercentage/keepSkills still
work (recreate only applies base stats when primaries are 0). Adds self
/dmzstats reset <keepPercentage> [keepSkills]. Instant Transmission to players
(party/external) is disabled; master IT still works. Master NPC disables,
priceless (-1) skill costs, /dmzskill set refreshes maxLevel. Built for DragonMineZ 2.2: Old Kai keeps
Precision (the challenge list is server-checked in 2.2; skipping it needs the jar on every client).
Blocks saga completion cheese: party sync cannot grant already-finished quests to
players who did not earn them, and unearned reward claims are cancelled.
Does not wipe saga progress on party leave, login, or death.
Clears ghost party UI state when PartyManager SavedData is solo but quest NBT
still has an activePartyId (leave/login heal + LeavePartyC2S mixin).
No ki_damage writes / damage redirects.
Hard-disables Dragon Block Noea experimental grab (Z grab/throw) when noeabosses is installed.
Per-event log lines stay out of the console unless debugLogging=true in
config/dmz_mohist_melee_fix-debug.properties.
'''

[[mixins]]
config = "dmz_mohist_melee_fix.mixins.json"

[[mixins]]
config = "dmz_mohist_melee_fix.raid.mixins.json"

[[mixins]]
config = "dmz_mohist_melee_fix.sdu.mixins.json"

[[mixins]]
config = "dmz_mohist_melee_fix.noea.mixins.json"

[[dependencies.dmz_mohist_melee_fix]]
